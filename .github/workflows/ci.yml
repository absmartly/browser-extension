name: CI

on:
  pull_request:
    # No branch filter: stacked PRs targeting a feature branch must be
    # tested on their actual merged head, not only PRs into main.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-flake-regressions:
    needs: e2e-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CI: true
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PLASMO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PLASMO_PUBLIC_ANTHROPIC_ENDPOINT: ${{ secrets.ANTHROPIC_ENDPOINT }}
      PLASMO_PUBLIC_ABSMARTLY_API_KEY: ${{ secrets.ABSMARTLY_API_KEY }}
      PLASMO_PUBLIC_ABSMARTLY_API_ENDPOINT: ${{ vars.ABSMARTLY_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run build
      - name: Three bounded repetitions of the five observed flaky paths, without retries
        run: >-
          bunx playwright test
          --grep 'should handle append action|extension generates DOM changes via Anthropic API|checkAuthentication with API Key|should persist and reload all experiment metadata including unit type|Test API_REQUEST message'
          --repeat-each=3 --retries=0 --workers=4
      - name: Redact credentials from retained evidence
        id: redact
        if: always()
        run: python3 tests/sanitize-artifacts.py
      - uses: actions/upload-artifact@v4
        if: always() && steps.redact.outcome == 'success'
        with:
          name: live-flake-regression-results
          path: test-results/
          retention-days: 7

  launchpad-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      - run: bun run build
      - run: bunx playwright test -c tests/reproductions/playwright.config.ts
        env:
          REPRO_OUTPUT_DIR: ${{ runner.temp }}/launchpad-regressions
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: launchpad-regression-results
          path: ${{ runner.temp }}/launchpad-regressions/
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: extension-build
          path: build/chrome-mv3-prod/
          retention-days: 7

  e2e-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each shard already has four concurrent browser workers. Running all
      # four shards together creates16 live clients against the same test-1
      # API and provider quota. Keep within-shard races, bound aggregate load.
      max-parallel: 1
      matrix:
        shard: [1/4, 2/4, 3/4, 4/4]
    name: e2e-tests (${{ matrix.shard }})
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium --with-deps
      # Build the production bundle and run e2e against it. The dev build
      # (plasmo dev --no-hot-reload) and the prod build (plasmo build) can
      # diverge in ways that ship broken: v1.4.2 had a content script that
      # threw "Cannot find module '@plasmohq/storage'" only in the prod
      # bundle, which the dev-build-based e2e suite never exercised. Always
      # test what we ship.
      - run: bun run build
        env:
          NODE_ENV: production
          PLASMO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLASMO_PUBLIC_ANTHROPIC_ENDPOINT: ${{ secrets.ANTHROPIC_ENDPOINT }}
          PLASMO_PUBLIC_ABSMARTLY_API_KEY: ${{ secrets.ABSMARTLY_API_KEY }}
          PLASMO_PUBLIC_ABSMARTLY_API_ENDPOINT: ${{ vars.ABSMARTLY_ENDPOINT }}
      - run: bunx playwright test --shard=${{ matrix.shard }}
        env:
          CI: true
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLASMO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLASMO_PUBLIC_ANTHROPIC_ENDPOINT: ${{ secrets.ANTHROPIC_ENDPOINT }}
          PLASMO_PUBLIC_ABSMARTLY_API_KEY: ${{ secrets.ABSMARTLY_API_KEY }}
          PLASMO_PUBLIC_ABSMARTLY_API_ENDPOINT: ${{ vars.ABSMARTLY_ENDPOINT }}
      - name: Redact credentials from retained evidence
        id: redact
        if: always()
        run: python3 tests/sanitize-artifacts.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLASMO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PLASMO_PUBLIC_ABSMARTLY_API_KEY: ${{ secrets.ABSMARTLY_API_KEY }}
      - uses: actions/upload-artifact@v4
        # Successful shards can contain failed attempts; retain their evidence.
        if: always() && steps.redact.outcome == 'success'
        with:
          name: playwright-report-shard-${{ strategy.job-index }}
          path: test-results/
          retention-days: 7
